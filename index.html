<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Galería Dinámica JS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Galería de imágenes</h1>
        <p class="introduccion">Escribe la ruta de una imagen y su pie de foto para agregarla.</p>
    </header>

    <div class="formulario">
        <input type="text" id="imagenURL" placeholder="img/lago.jpg o URL de imagen">
        <input type="text" id="pieFoto" placeholder="pie de foto">
        <button onclick="agregaImagen()">Agregar imagen</button>
    </div>

    <p id="mensajeGaleria" class="mensaje" role="status" aria-live="polite"></p>

    <main id="galeriaImagenes"></main>

    <script src="script.js"></script>
</body>
</html>
